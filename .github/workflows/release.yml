name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v3.1.0)"
        required: true
        default: "v3.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cross: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, cross: true }   # Raspberry Pi 3/4/5 (64-bit)
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-22.04, cross: true } # Raspberry Pi (32-bit OS)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: test (native targets)
        if: ${{ !matrix.cross }}
        run: cargo test --release
      - name: package
        run: scripts/release.sh --target ${{ matrix.target }} ${{ matrix.cross && '--cross' || '' }} --no-vsix
      - uses: actions/upload-artifact@v4
        with:
          name: tulpa-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  # macOS binaries are best-effort: a missing or busy macOS runner must not block the release.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: test (host)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --release
      - name: package
        run: scripts/release.sh --target ${{ matrix.target }} --no-vsix --no-deb
      - uses: actions/upload-artifact@v4
        with:
          name: tulpa-${{ matrix.target }}
          path: dist/*.tar.gz

  vsix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd editors/vscode && npm install --no-audit --no-fund && npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: tulpa-vscode
          path: editors/vscode/*.vsix

  publish:
    needs: [build, vsix, macos]
    runs-on: ubuntu-22.04
    if: >-
      always() && needs.build.result == 'success' && needs.vsix.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Tulpa ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
