name: Android (Tulpa Field)

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["android/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release (tag android-v<version>)"
        type: boolean
        default: false
      version:
        description: "Version for a published build, e.g. 1.0.0"
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          base="$(tr -d ' \n' < android/VERSION)"
          v="$base"; release=false
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            v="${GITHUB_REF#refs/tags/android-v}"; release=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            v="${INPUT_VERSION:-$base}"; [ "$INPUT_PUBLISH" = true ] && release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && \
               ! gh release view "android-v$base" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release=true   # android/VERSION bumped on main and not yet released
          fi
          echo "TULPA_FIELD_VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Tulpa Field $v (release=$release)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native

      - name: "Native bridge: fmt, clippy, host tests (phone module + every bundled example)"
        working-directory: android/native
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build libtulpa_android.so for arm64-v8a, armeabi-v7a, x86_64
        working-directory: android/native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.TULPA_FIELD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.TULPA_FIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.TULPA_FIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.TULPA_FIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — APK is signed with an ephemeral debug key and will not be published."
          fi

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TulpaField-${TULPA_FIELD_VERSION#android-v}.apk"
          ls -la dist
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: TulpaField-apk
          path: dist/*.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (launch, run a snippet, an example and the REPL)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: android/ci/smoke.sh dist/TulpaField-${TULPA_FIELD_VERSION#android-v}.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/

      - name: Publish release
        if: steps.ver.outputs.release == 'true' && steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.version }}
          name: Tulpa Field ${{ env.TULPA_FIELD_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            **Tulpa Field** — the TulpaLang IDE for Android.

            Download the APK below and open it on your phone (allow "install unknown apps" for your browser or file manager once).
            Requires Android 8.0+ on arm64, armv7 or x86_64. Signed with the HermiTech release key.

      - name: Release skipped (unsigned)
        if: steps.ver.outputs.release == 'true' && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Release android-v${{ steps.ver.outputs.version }} was not published: add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to this repository, then re-run."
          exit 1
