name: Android (Tulpa Field)

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["android/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release (tag android-v<version>)"
        type: boolean
        default: false
      version:
        description: "Version for a published build, e.g. 1.0.0"
        default: "1.0.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TULPA_FIELD_VERSION: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native

      - name: Native bridge — fmt, clippy, host tests (phone:: module + every bundled example)
        working-directory: android/native
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build libtulpa_android.so for arm64-v8a, armeabi-v7a, x86_64
        working-directory: android/native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.TULPA_FIELD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.TULPA_FIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TULPA_FIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TULPA_FIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "Signing with the release keystore."
          else
            echo "No keystore secret — the APK is signed with the CI debug key (installable, but not upgradeable across machines)."
          fi

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TulpaField-${TULPA_FIELD_VERSION#android-v}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TulpaField-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('android-v{0}', inputs.version) }}
          name: Tulpa Field ${{ env.TULPA_FIELD_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            **Tulpa Field** — the TulpaLang IDE for Android.

            Download the APK below and open it on your phone (allow "install unknown apps" for your browser or file manager once).
            Requires Android 8.0+ on arm64, armv7 or x86_64.
