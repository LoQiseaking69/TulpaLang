name: Tulpa Field (Android + iOS)

on:
  push:
    branches: [main]
    tags: ["field-v*", "android-v*"]
    paths: ["android/**", "ios/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "ios/**", "src/**", "stdlib/**", "examples/**", "docs/**", "Cargo.toml", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK and IPA as a GitHub release (tag field-v<version>)"
        type: boolean
        default: false
      version:
        description: "Version for a published build (default: android/VERSION)"
        default: ""

permissions:
  contents: write

concurrency:
  group: field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          base="$(tr -d ' \n' < android/VERSION)"
          v="$base"; release=false
          if [[ "$GITHUB_REF" == refs/tags/field-v* ]]; then
            v="${GITHUB_REF#refs/tags/field-v}"; release=true
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            v="${GITHUB_REF#refs/tags/android-v}"; release=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            v="${INPUT_VERSION:-$base}"; [ "$INPUT_PUBLISH" = true ] && release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && \
               ! gh release view "field-v$base" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release=true   # android/VERSION bumped on main and not yet released
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Tulpa Field $v (release=$release)"

  apk:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      TULPA_FIELD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native

      - name: Cache MuJoCo builds
        uses: actions/cache@v4
        with:
          path: android/mujoco
          key: mujoco-4.0.1-${{ runner.os }}-${{ hashFiles('android/ci/build-mujoco.sh') }}

      - name: Build MuJoCo (host + arm64-v8a, armeabi-v7a, x86_64)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sudo apt-get install -y -qq ninja-build > /dev/null
          android/ci/build-mujoco.sh

      - name: "Native bridge: fmt, clippy, host tests (phone module, physics + co-sim, every bundled example)"
        working-directory: android/native
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build libtulpa_android.so for arm64-v8a, armeabi-v7a, x86_64 (+ libmujoco.so)
        working-directory: android/native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o ../app/src/main/jniLibs build --release
          for abi in arm64-v8a armeabi-v7a x86_64; do cp ../mujoco/$abi/lib/libmujoco.so ../app/src/main/jniLibs/$abi/; done
          # the NDK toolchain always compiles with -g: strip debug info before packaging
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded ../app/src/main/jniLibs/*/*.so
          ls -la ../app/src/main/jniLibs/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release signing key
        id: sign
        env:
          # Accept repository secrets or variables (and the older TULPA_FIELD_* names)
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || secrets.TULPA_FIELD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || secrets.TULPA_FIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || secrets.TULPA_FIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || secrets.TULPA_FIELD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — APK is signed with an ephemeral debug key and will not be published."
            exit 0
          fi
          # tolerate whitespace/newlines pasted into the secret
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/release.jks
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')"
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing::KEYSTORE_PASSWORD is empty — add it as a repository secret."; exit 1
          fi
          if ! keytool -list -keystore android/release.jks -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1; then
            echo "::error title=Signing::Cannot open the keystore — KEYSTORE_PASSWORD does not match KEYSTORE_BASE64."; cat /tmp/ks.txt | grep -v JAVA_TOOL; exit 1
          fi
          # PKCS12 stores use the store password for the key
          grep -q "Keystore type: PKCS12" /tmp/ks.txt && KEY_PASSWORD="$KEYSTORE_PASSWORD"
          aliases="$(keytool -list -v -keystore android/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p')"
          if [ -z "$KEY_ALIAS" ] || ! printf '%s\n' "$aliases" | grep -qx "$KEY_ALIAS"; then
            [ -n "$KEY_ALIAS" ] && echo "::warning title=Signing::KEY_ALIAS '$KEY_ALIAS' is not in the keystore (has: $aliases); using the keystore's key."
            KEY_ALIAS="$(printf '%s\n' "$aliases" | head -1)"
          fi
          echo "Key alias: $KEY_ALIAS"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing with the release keystore."

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TulpaField-${TULPA_FIELD_VERSION#android-v}.apk"
          ls -la dist
          size=$(stat -c %s dist/*.apk)
          if [ "$size" -gt 60000000 ]; then echo "::error::APK is $((size / 1000000)) MB: native libraries were not stripped?"; exit 1; fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk > dist/signature.txt
          grep -iE "DN:|SHA-256" dist/signature.txt || cat dist/signature.txt
          rm dist/signature.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TulpaField-apk
          path: dist/*.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (launch, run a snippet, an example and the REPL)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: android/ci/smoke.sh dist/TulpaField-${TULPA_FIELD_VERSION#android-v}.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-android
          path: smoke/

  ipa:
    needs: version
    runs-on: macos-15
    env:
      TULPA_FIELD_VERSION: ${{ needs.version.outputs.version }}
      TF_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install xcodegen ninja > /dev/null
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          xcodebuild -version
          xcodegen --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/native

      - name: Cache MuJoCo builds
        uses: actions/cache@v4
        with:
          path: ios/mujoco
          key: mujoco-4.0.1-ios-${{ hashFiles('ios/ci/build-mujoco.sh') }}

      - name: Build MuJoCo (iphoneos + iphonesimulator, static)
        run: ios/ci/build-mujoco.sh

      - name: Build libtulpa_ios.a (device + simulator)
        run: ios/ci/build-native.sh

      - name: Generate the Xcode project
        run: |
          ios/ci/sync-assets.sh
          ios/ci/gen-project.sh

      - name: "Simulator smoke test (XCUITest: guide, library, editor, REPL, sensors, MuJoCo co-sim)"
        run: ios/ci/smoke.sh smoke-ios

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-ios
          path: |
            smoke-ios/
            ios/build/smoke.log

      - name: Archive and package the IPA (unsigned build, ad-hoc signature)
        run: ios/ci/package-ipa.sh

      - name: AltStore / SideStore source
        run: ios/ci/altstore-source.sh "dist/TulpaField-$TULPA_FIELD_VERSION.ipa" "field-v$TULPA_FIELD_VERSION" dist/altstore-source.json

      - uses: actions/upload-artifact@v4
        with:
          name: TulpaField-ipa
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/altstore-source.json

  release:
    needs: [version, apk, ipa]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require a release-signed APK
        if: needs.apk.outputs.signed != 'true'
        run: |
          echo "::error::Release field-v${{ needs.version.outputs.version }} was not published: add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to this repository, then re-run."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish release (APK + IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: field-v${{ needs.version.outputs.version }}
          name: Tulpa Field ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            dist/*.apk
            dist/*.ipa
            dist/*.sha256
            dist/altstore-source.json
          body: |
            **Tulpa Field** — the TulpaLang IDE for Android and iOS.

            ### Android
            Download `TulpaField-${{ needs.version.outputs.version }}.apk` and open it on your phone (allow "install unknown apps" for your browser or file manager once).
            Requires Android 8.0+ on arm64, armv7 or x86_64. Signed with the HermiTech release key.

            ### iPhone / iPad
            Download `TulpaField-${{ needs.version.outputs.version }}.ipa` and sideload it with a free Apple ID — no developer account needed:
            - **AltStore** or **SideStore**: add the source `https://github.com/${{ github.repository }}/releases/download/field-v${{ needs.version.outputs.version }}/altstore-source.json`, or open the IPA in the app. They refresh the 7-day signature for you.
            - **Sideloadly** (Windows/macOS): drag the IPA in and sign with your Apple ID.
            - **TrollStore** (supported iOS versions): install the IPA directly, no re-signing.

            Requires iOS 16+ on an arm64 device. The IPA is ad-hoc signed; your sideloading tool re-signs it with your Apple ID. See [ios/README.md](https://github.com/${{ github.repository }}/blob/main/ios/README.md).
