# XcodeGen spec for Tulpa Field (iOS). Generate with `ios/ci/gen-project.sh` (reads the shared
# version from android/VERSION) or `TF_VERSION=1.5.0 TF_BUILD=1 xcodegen generate`.
name: TulpaField
options:
  bundleIdPrefix: dev.hermitech
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: ${TF_VERSION}
    CURRENT_PROJECT_VERSION: ${TF_BUILD}
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  TulpaField:
    type: application
    platform: iOS
    sources:
      - path: TulpaField/Sources
      - path: TulpaField/Assets.xcassets
      - path: build/TulpaAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TulpaField
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermitech.tulpafield
        INFOPLIST_FILE: TulpaField/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: TulpaField/Sources/TulpaField-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/native/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/lib/$(PLATFORM_NAME) $(PROJECT_DIR)/mujoco/$(PLATFORM_NAME)/lib
        OTHER_LDFLAGS: -ltulpa_ios -force_load $(PROJECT_DIR)/mujoco/$(PLATFORM_NAME)/lib/libmujoco.a -lmujoco_deps -lc++ -lresolv -framework Security -framework CoreFoundation -framework SystemConfiguration
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: ""
        STRIP_INSTALLED_PRODUCT: YES
        MTL_FAST_MATH: YES
    info:
      path: TulpaField/Info.plist
      properties:
        CFBundleDisplayName: Tulpa Field
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Tulpa programs read the accelerometer, gyroscope, magnetometer and barometer through phone::sensor.
        NSLocationWhenInUseUsageDescription: Tulpa programs can read GPS position and speed through phone::sensor("gps").
        NSCameraUsageDescription: Tulpa programs can switch the flashlight on and off through phone::torch.
        NSLocalNetworkUsageDescription: Co-simulation and Tulpa Link talk to programs and devices on your local network.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tulpa source
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.hermitech.tulpa.source]
          - CFBundleTypeName: MuJoCo model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xml]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.hermitech.tulpa.source
            UTTypeDescription: Tulpa source
            UTTypeConformsTo: [public.plain-text, public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [rav, tlp, tulpa]
  TulpaFieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TulpaFieldUITests]
    dependencies:
      - target: TulpaField
    settings:
      base:
        TEST_TARGET_NAME: TulpaField
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermitech.tulpafield.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TulpaField:
    build:
      targets:
        TulpaField: all
        TulpaFieldUITests: [test]
    test:
      targets: [TulpaFieldUITests]
    archive:
      config: Release
